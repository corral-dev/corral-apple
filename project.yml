name: Corral

options:
  bundleIdPrefix: com.example
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  defaultConfig: Debug
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # Mac terminal view (owner decision 2026-10-05) and the project terminal on
  # both clients (owner request 2026-10-07); pinned release.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MARKETING_VERSION: "1.0.187"
    CURRENT_PROJECT_VERSION: "197"
    CODE_SIGN_STYLE: Automatic

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

targets:
  Corral:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.corral
        INFOPLIST_KEY_CFBundleDisplayName: Corral
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: iOS/Corral.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CorralKeychainAccessGroup: $(AppIdentifierPrefix)$(CORRAL_KEYCHAIN_GROUP)
        NSBonjourServices:
          - _corral._tcp.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.corral
            CFBundleURLSchemes:
              - corral
        UILaunchScreen: {}
        NSCameraUsageDescription: Corral uses the camera to scan the pairing QR code on your computer.
        NSPhotoLibraryUsageDescription: Corral lets you pick a photo to send to a running assistant session.
        NSLocalNetworkUsageDescription: Corral uses the local network to connect directly to your computer without a public relay.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iOS/Corral.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CORRAL_KEYCHAIN_GROUP)
    dependencies:
      - target: CorralNSE
        embed: true
      # Project terminal screen only (owner request 2026-10-07).
      - package: SwiftTerm

  CorralNSE:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      # 扩展需要自己编一份加密与钥匙串代码，不能链主 App 的二进制。
      - path: Shared/Core/Crypto/RemoteCrypto.swift
      - path: Shared/Core/Store/HostKeychain.swift
      - path: Shared/Core/Push/NotificationPreview.swift
      - path: Shared/Core/Push/SessionNotificationText.swift
      - path: Shared/Core/Push/NotificationSound.swift
      - path: Shared/Resources/Sounds
      - path: Shared/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.corral.nse
        INFOPLIST_KEY_CFBundleDisplayName: Corral NSE
        CODE_SIGN_ENTITLEMENTS: NotificationService/CorralNSE.entitlements
        SKIP_INSTALL: YES
        # 通知扩展回调在系统线程上，不能默认整类 MainActor。
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Corral
        CorralKeychainAccessGroup: $(AppIdentifierPrefix)$(CORRAL_KEYCHAIN_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/CorralNSE.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CORRAL_KEYCHAIN_GROUP)

  CorralMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: macOS
        excludes:
          - "**/.DS_Store"
          - AppIcon.icon
          - "AppIcon.icon/**"
      - path: macOS/AppIcon.icon
        buildPhase: resources
      - path: Shared
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Corral
        PRODUCT_BUNDLE_IDENTIFIER: com.example.corral
        MARKETING_VERSION: "0.3.138"
        CURRENT_PROJECT_VERSION: "142"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    info:
      path: macOS/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDisplayName: Corral
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSBonjourServices:
          - _corral._tcp.
        NSLocalNetworkUsageDescription: Corral uses the local network to connect directly to your computer without a public relay.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.corral
            CFBundleURLSchemes:
              - corral

  CorralTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Corral
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.corral.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Corral.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Corral"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # XCTestCase 生命周期不能默认 MainActor。
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  CorralMac:
    build:
      targets:
        CorralMac: all
    run:
      config: Debug
    archive:
      config: Release
  Corral:
    build:
      targets:
        Corral: all
        CorralNSE: all
        CorralTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CorralTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
